[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeml-pro"
version = "0.1.0"
description = "A fraud detection project with temporal features, model comparison and a local dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "joblib>=1.3,<2", "pyarrow>=14", "fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1", "matplotlib>=3.9,<4", "httpx>=0.27,<1"]

[project.optional-dependencies]
boosting = ["xgboost>=2,<4", "lightgbm>=4,<5"]
research = ["xgboost>=2,<4", "lightgbm>=4,<5", "optuna>=4,<5", "mlflow>=2.16,<4", "shap>=0.46,<1", "evidently>=0.6,<1"]
browser = ["playwright>=1.48,<2"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["forgeml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
